<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Table Playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>Card Table Playground</h1>
        <p>Draw a random set of cards from a standard 52-card deck.</p>
      </header>

      <section class="controls">
        <label for="card-count">Number of cards (1-52)</label>
        <div class="controls-row">
          <input id="card-count" type="number" min="1" max="52" value="5" />
          <button id="draw-button" type="button">Draw</button>
        </div>
        <fieldset class="mode-toggle">
          <legend>Card style</legend>
          <label>
            <input
              type="radio"
              name="render-mode"
              value="unicode"
              checked
            />
            Unicode symbols
          </label>
          <label>
            <input type="radio" name="render-mode" value="image" />
            Card face images (SVG)
          </label>
        </fieldset>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section class="table">
        <div id="card-table" class="card-table" aria-live="polite"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
